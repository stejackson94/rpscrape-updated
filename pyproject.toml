[project]
name = "rpscrape"
version = "0.1.0"
description = "Horse racing data scraper"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "curl_cffi>=0.13",
    "jarowinkler>=2.0.1",
    "lxml>=4.7",
    "orjson>=3.6",
    "python-dotenv>=1.2",
    "tomli>=2.0",
    "tqdm>=4.67",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.5.0",
    "ruff>=0.1.0",
]

[tool.uv]
managed = true
package = false
